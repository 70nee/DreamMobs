name: DreamMobs
version: 1.1.1
main: dev.dreammobs.DreamMobsPlugin
api-version: '1.21.11'
description: Naturally spawning powerful Dream mobs with optional player disguises
softdepend: [LibsDisguises]
commands:
  dreammobs:
    description: DreamMobs admin commands
    usage: /dreammobs <spawn|reload|status>
    permission: dreammobs.admin
permissions:
  dreammobs.admin:
    description: Allows DreamMobs admin commands
    default: op
